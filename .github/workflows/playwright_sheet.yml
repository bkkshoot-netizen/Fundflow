name: Run Selenium & Send to Apps Script

on:
  schedule:
    - cron: '0 7 * * 1-5' # จันทร์-ศุกร์ เวลา 18:00 น.
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          python bot.py
